plugins {
    id 'com.android.application'
}

// 서명 열쇠는 GitHub Secrets에서 받는다(코드에 넣지 않음). 기록 앱 공용 열쇠(record, 원본 ★개인\_맥락\비밀키\record\).
// 열쇠가 바뀌면 덮어 깔 수 없어 지우고 다시 깔아야 하고, 그때 통화 기록 권한이 꺼진다.
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'app.relrecord'
    compileSdk 35

    defaultConfig {
        applicationId 'app.relrecord'
        minSdk 29
        targetSdk 35
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
        // 앱 정보에 보이는 버전: 1.(GitHub 빌드 번호). 사이트 /app/version.json의 versionCode와 같은 번호.
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias(System.getenv('KEY_ALIAS') ?: 'record')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
