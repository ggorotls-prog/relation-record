# 관계 기록 앱 APK를 GitHub가 만든다(2026-11-11, 업무 기록·카톡 기록 앱과 같은 방식). 컴퓨터에 설치할 것 없음.
# android/ 를 고쳐 올리면 자동으로, 또는 Actions 탭에서 「Run workflow」로 만든다.
name: android-apk

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # 열쇠는 고정(기록 앱 공용 record). 없으면 멈춘다: 새 열쇠로 만들면 폰에 덮어 깔 수 없다.
      - name: 서명 열쇠 꺼내기
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "GitHub Secrets에 KEYSTORE_B64가 없어요"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/record.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/record.p12" >> "$GITHUB_ENV"
      - name: APK 만들기
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: relation-record-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # 가상 안드로이드 폰에 깔아서 실제로 켜 본다. 켜자마자 꺼지면 오류 기록을 남기고 실패로 표시한다.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: relation-record-apk
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell am start -W -n app.relrecord/.MainActivity
            sleep 15
            adb logcat -d -b crash > crash.txt || true
            echo "===== crash ====="; cat crash.txt
            if grep -q "FATAL EXCEPTION" crash.txt; then exit 1; fi
            adb shell pidof app.relrecord || { echo "앱이 꺼져 있어요"; exit 1; }
            echo "앱이 켜져 있어요"
            adb exec-out screencap -p > shot-light.png || true
            adb shell cmd uimode night yes || true
            adb shell am force-stop app.relrecord
            adb shell am start -W -n app.relrecord/.MainActivity
            sleep 6
            adb exec-out screencap -p > shot-dark.png || true
            adb shell cmd uimode night no || true
            # 권한을 켜고 전화가 왔다 끊겨도 꺼지지 않는지(가상 전화)
            adb shell pm grant app.relrecord android.permission.READ_CALL_LOG || true
            adb shell pm grant app.relrecord android.permission.READ_PHONE_STATE || true
            adb shell pm grant app.relrecord android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop app.relrecord
            adb logcat -c
            adb shell am start -W -n app.relrecord/.MainActivity
            sleep 5
            adb emu gsm call 01012345678 || true
            sleep 3
            adb emu gsm accept 01012345678 || true
            sleep 5
            adb emu gsm cancel 01012345678 || true
            sleep 12
            adb logcat -d -b crash > crash2.txt || true
            echo "===== crash (권한 켬·가상 전화) ====="; cat crash2.txt
            if grep -q "FATAL EXCEPTION" crash2.txt; then exit 1; fi
            # 통화 화면이 앞에 오면 폰이 뒤에 있는 앱을 정리할 수 있어 「켜져 있나」는 보지 않고 오류(FATAL)만 본다(2026-11-11 3번 빌드)
            adb exec-out screencap -p > shot-perm.png || true
            # 인터넷을 끄고 켜 봐도 꺼지지 않는지
            adb shell svc wifi disable; adb shell svc data disable; adb shell cmd connectivity airplane-mode enable || true
            adb shell am force-stop app.relrecord
            adb logcat -c
            adb shell am start -W -n app.relrecord/.MainActivity
            sleep 10
            adb logcat -d -b crash > crash3.txt || true
            echo "===== crash (인터넷 끔) ====="; cat crash3.txt
            if grep -q "FATAL EXCEPTION" crash3.txt; then exit 1; fi
            adb shell pidof app.relrecord || { echo "인터넷 끄니 앱이 꺼져 있어요"; exit 1; }
            echo "인터넷 꺼도 앱이 켜져 있어요"
      # 화면 사진(밝은·어두운): 모양 확인용
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shot-*.png

  # main에서 만들고 가상 폰 확인까지 통과하면, APK를 사이트(app/)에 올린다.
  # 폰의 앱이 app/version.json을 보고 새 버전이면 스스로 받아서 업데이트한다. (플레이 스토어 없이 0원)
  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: relation-record-apk
          path: dist
      - name: 사이트에 올리기
        run: |
          mkdir -p app
          cp dist/app-release.apk app/relation-record.apk
          SHA=$(sha256sum app/relation-record.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"apk":"/app/relation-record.apk","sha256":"%s"}\n' "$GITHUB_RUN_NUMBER" "$SHA" > app/version.json
          git config user.name "relation-record-bot"
          git config user.email "relation-record-bot@users.noreply.github.com"
          git add -f app
          git commit -m "앱 새 버전 올림 (${GITHUB_RUN_NUMBER})"
          git pull --rebase -q origin main
          git push origin HEAD:main
